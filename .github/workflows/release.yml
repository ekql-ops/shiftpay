name: release

# Builds the Windows app and attaches it to a GitHub Release, so people can
# download a ready-to-run zip without installing Python.
#
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name "ShiftPay"
          --icon assets/icon.ico
          --add-data "assets/icon.ico;."
          app.pyw

      - name: Package
        run: Compress-Archive -Path "dist/ShiftPay/*" -DestinationPath "ShiftPay-windows.zip"
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftPay-windows
          path: ShiftPay-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ShiftPay-windows.zip
          generate_release_notes: true
