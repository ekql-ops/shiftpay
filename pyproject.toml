[project]
name = "work-tracker"
version = "1.0.0"
description = "Track shift pay, sick pay and pay periods from one tap a day"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Abubakar Albakri" }]
keywords = ["payroll", "shift-work", "timesheet", "tkinter", "desktop"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller"]

[project.scripts]
work = "worktracker.cli:main"

[project.urls]
Homepage = "https://github.com/ekql-ops/work-tracker"
Issues = "https://github.com/ekql-ops/work-tracker/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["worktracker"]
